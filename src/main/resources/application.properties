spring.application.name=dentavista
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite (se crea sola junto al ejecutable)
spring.datasource.url=jdbc:sqlite:dentavista.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Registro de actividad
logging.level.root=WARN
logging.level.com.erejm.dentavista=INFO

# Primer uso: con la base vacia se abre el asistente "Configurar consultorio" (datos de
# la clinica y cuenta del administrador; los pacientes de ejemplo son opcionales).
# En true, una base vacia se llena sola con datos de ejemplo (pruebas y capturas).
app.demo.enabled=false
